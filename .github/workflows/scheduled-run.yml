# Drives the autonomous loop at the cadence the agent is designed for.
#
# Vercel's Hobby plan runs cron once per day, which is not enough for an agent whose whole
# claim is that it decides repeatedly without being asked. GitHub Actions schedules are free
# and unmetered for public repositories, so the loop lives here and the endpoint stays the
# single place every guard is enforced.
#
# Required repository secrets:
#   VOLGUARD_URL  — deployment origin, e.g. https://volguard.vercel.app
#   CRON_SECRET   — must match the deployment's CRON_SECRET
name: Scheduled agent run

on:
  schedule:
    # Every 15 minutes during US market hours, weekdays. GitHub runs schedules in UTC and
    # may delay them under load; the endpoint owns its own interval gate, so an early or
    # late call is safe.
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch:

# A run in flight should not be joined by another.
concurrency:
  group: volguard-scheduled
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the scheduled endpoint
        env:
          VOLGUARD_URL: ${{ secrets.VOLGUARD_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$VOLGUARD_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::VOLGUARD_URL and CRON_SECRET repository secrets are required."
            exit 1
          fi
          code=$(curl -sS -o /tmp/response.json -w "%{http_code}" \
            -X POST "$VOLGUARD_URL/api/agent/scheduled" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 120)
          echo "HTTP $code"
          # The endpoint answers 200 with a `skipped` reason when a guard declines the run —
          # schedule disabled, interval not elapsed, kill switch. Those are not failures.
          cat /tmp/response.json
          if [ "$code" != "200" ]; then
            echo "::error::Scheduled run returned HTTP $code"
            exit 1
          fi
